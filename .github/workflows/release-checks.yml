name: IPCOS release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  student-and-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: release-test-results
          path: test-results/
          retention-days: 7
